[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiguide"
version = "0.1.0"
description = "Direkte arbeidsmodus for AI-assistanse — verktøy for å sende malbaserte prompts og logge samtaler."
readme = "README.md"
requires-python = ">=3.8"
authors = [
  {name = "bspippi1337"}
]
license = {text = "MIT"}
keywords = ["ai","assistant","prompt","logging","aiguide"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "openai>=0.27.0"
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "tmp", "chatlogs"]
